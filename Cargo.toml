[workspace]
members = ["crates/orbitcore-core", "crates/orbitcore-astro", "crates/orbitcore-sgp4"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Muhammad Rivaldy Pratama <m.rivaldypratama4@gmail.com>"]
repository = "https://github.com/LlvallVeiz/orbitcore"
homepage = "https://github.com/LlvallVeiz/orbitcore"
description = "Design, simulate, and fly a CubeSat from a single Rust codebase — orbit, power, link, and operations in one mission digital twin."

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
# Upstream SGP4 (neuromorphicsystems/sgp4) v2.4.0 — the propagation math
# for orbitcore-sgp4; OrbitCore wraps it, never re-implements it.
sgp4 = { version = "2.4.0" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
